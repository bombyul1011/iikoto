<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="triplog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8ee">
<link rel="manifest" href="manifest.webmanifest">
<title>triplog</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8ee;--tx:#2b2a1e;--sub:#645d49;--line:#e9e3cf;--ac:#6fb04c;--acd:#3a7a2a;--okt:#2f6e2c;--okb:#e2f0d2;--okbr:#c9e2b0;--pnt:#6b4a00;--pnb:#ffe9a6;--card:#fff;--sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;--serif:'Noto Serif KR','Noto Sans KR',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
a{color:var(--acd)}
#app{max-width:480px;margin:0 auto;min-height:100vh}
#screen{padding:14px 20px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
#tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
#tabbar button{flex:1;min-height:50px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--sub);padding:0}
#tabbar button.on{color:var(--okt);font-weight:700}
#tabbar .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
#tabbar button.on .pill{background:var(--okb)}
h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.2}
.sub{font-size:13px;color:var(--sub);margin-top:4px}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.card.sm{padding:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.2;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--okt)}
.chip.pn{background:var(--pnb);color:var(--pnt)}
.chip.ln{background:var(--bg);color:var(--tx);border:1px solid var(--line)}
.muted{color:var(--sub)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.btn{min-height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn.pri{background:var(--pnb);color:var(--pnt);border:0;font-weight:700;font-size:15px;min-height:48px;width:100%}
.btn.sm{min-height:44px;border-radius:999px}
.btn.on{background:var(--okb);color:var(--okt);border-color:var(--okbr);font-weight:700}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--acd);padding:0;text-decoration:none}
.seg{display:flex;gap:6px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--sub);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--okb);color:var(--okt);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--okt)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.strip button{flex:none;width:40px;height:72px;padding:8px 0;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.strip button.on{background:var(--okb);border-color:var(--okbr);color:var(--okt)}
.strip .w{font-size:12px;color:var(--sub)}
.strip button.on .w{color:var(--okt)}
.strip .d{font-size:17px;font-weight:500}
.strip button.on .d{font-weight:700}
.strip .b{display:flex;gap:2px;width:22px}
.strip .b span{flex:1;height:3px;border-radius:2px;opacity:.6}
.tl{position:relative;display:flex;flex-direction:column;gap:10px}
.tl:before{content:'';position:absolute;left:58px;top:12px;bottom:12px;width:2px;background:var(--line)}
.ev{display:flex;align-items:flex-start;gap:8px;position:relative}
.ev .t{width:44px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--sub);padding-top:14px}
.ev .dot{width:14px;flex:none;padding-top:17px}
.ev .dot span{display:block;width:12px;height:12px;border-radius:50%;border:2.5px solid;background:#fff}
.ev .c{flex:1;min-width:0}
.ev h3{margin:0;font-size:15px;line-height:1.35}
.ev p{margin:3px 0 0;font-size:13px;color:var(--sub);line-height:1.45}
.plan{flex:1;min-width:0;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;min-height:96px;display:flex;flex-direction:column;gap:6px}
.plan.on{background:var(--okb);border:1.5px solid var(--okbr)}
.plan b{font-size:14px}
.plan span{font-size:12px;color:var(--sub);line-height:1.45}
.pl{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13px}
.pl ul{margin:6px 0 0;padding-left:0;list-style:none}
.pl li{display:flex;align-items:center;gap:8px;padding:4px 0;line-height:1.45}
.ck{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);font-size:14px}
.ck:last-of-type{border-bottom:0}
.ck input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--okt);flex:none}
.ck.done .tx{text-decoration:line-through;color:var(--sub)}
.ck .tx{flex:1;line-height:1.4}
.ck .mini{width:36px;height:44px;border:0;background:transparent;color:var(--sub);padding:0;display:flex;align-items:center;justify-content:center}
.ck input.edit{flex:1;min-width:0;height:40px;border:1px solid var(--okbr);border-radius:8px;padding:0 8px;background:#fff}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input,.fld{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:14px}
textarea.fld{height:auto;min-height:72px;padding:10px 12px;width:100%}
select.fld{background:#fff}
.sheetwrap{position:fixed;inset:0;background:rgba(43,42,30,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:90%}
.memo{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.memo:last-child{border-bottom:0}
.memo img{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.gantt{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.syncst{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:transparent;border:0;padding:0;min-height:44px}
</style>
</head>
<body>
<div id="app"><main id="screen"></main><nav id="tabbar" aria-label="하단 탭"></nav></div>
<div id="sheet"></div><div id="toast"></div>
<script src="triplog.js?v=2026.10.05-1"></script>
</body>
</html>
