<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iikoto 데이터 복구</title>
<style>
body{font-family:-apple-system,sans-serif;padding:30px 20px;background:#fef9f5;color:#5a4040;}
h2{font-size:18px;margin-bottom:20px;}
button{width:100%;padding:14px;border-radius:12px;border:none;background:#c07080;color:#fff;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:10px;}
button:active{opacity:.8;}
.btn2{background:rgba(100,180,170,0.3);color:#2a7868;}
.status{background:#fff;border-radius:12px;padding:14px;font-size:13px;line-height:1.8;min-height:100px;margin-top:16px;border:1px solid rgba(192,112,128,0.2);white-space:pre-wrap;}
.ok{color:#2a7868;}.err{color:#c03030;}
</style>
</head>
<body>
<h2>🌿 iikoto 데이터 복구</h2>
<button onclick="restoreAll()">🔄 전체 복구 (6/10~6/14)</button>
<button class="btn2" onclick="checkStorage()">📋 현재 저장 상태 확인</button>
<div class="status" id="log">버튼을 눌러 복구를 시작하세요...</div>

<script>
const SUPA_URL='https://vqvpzrxmtpryzhontlxc.supabase.co/rest/v1';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdnB6cnhtdHByeXpob250bHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTgxMjksImV4cCI6MjA5NjYzNDEyOX0.pbtq1UMPC7ylYM1H2xVa19C1TFlceLmEfEtkz3WK2VI';

function addLog(msg,cls){
  const el=document.getElementById('log');
  const span=document.createElement('span');
  span.className=cls||'';
  span.textContent=msg;
  el.appendChild(span);
  el.appendChild(document.createTextNode('\n'));
}

async function supa(path){
  const res=await fetch(SUPA_URL+'/'+path,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
  return res.json();
}

function Sset(k,v){localStorage.setItem(k,JSON.stringify(v));}
function Sget(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}

async function restoreDate(dk){
  addLog('\n📅 '+dk+' 복구 중...');
  const memos=await supa('memos?date_key=eq.'+dk+'&order=created');
  if(memos&&memos.length>0){
    Sset('memos:'+dk,memos.map(function(r){return {time:r.memo_time,text:r.text,photo:r.photo,created:r.created};}));
    addLog('  ✅ 메모 '+memos.length+'개 복구','ok');
  } else {
    addLog('  - 메모 없음');
  }
  const todos=await supa('todos?date_key=eq.'+dk+'&order=created');
  if(todos&&todos.length>0){
    Sset('todos:'+dk,todos.map(function(r){return {text:r.text,done:r.done,created:r.created,sort_order:r.sort_order||0};}));
    addLog('  ✅ 투두 '+todos.length+'개 복구','ok');
  } else {
    addLog('  - 투두 없음');
  }
  const sleep=await supa('sleep?date_key=eq.'+dk);
  if(sleep&&sleep.length>0){
    Sset('sleep:'+dk,{sleep:sleep[0].sleep_time,wake:sleep[0].wake_time});
    addLog('  ✅ 수면 복구','ok');
  } else {
    addLog('  - 수면 없음');
  }
}

async function restoreAll(){
  document.getElementById('log').innerHTML='';
  addLog('🌿 복구 시작...');
  const dates=['2026-06-10','2026-06-11','2026-06-12','2026-06-13','2026-06-14'];
  for(let i=0;i<dates.length;i++){
    await restoreDate(dates[i]);
    await new Promise(function(r){setTimeout(r,400);});
  }
  addLog('\n🎉 전체 복구 완료! iikoto로 돌아가세요.','ok');
}

function checkStorage(){
  document.getElementById('log').innerHTML='';
  const dates=['2026-06-10','2026-06-11','2026-06-12','2026-06-13','2026-06-14'];
  dates.forEach(function(dk){
    const m=Sget('memos:'+dk)||[];
    const t=Sget('todos:'+dk)||[];
    const s=Sget('sleep:'+dk)||{};
    addLog(dk+': 메모 '+m.length+'개, 투두 '+t.length+'개, 수면 '+(s.sleep?'있음':'없음'));
  });
}
</script>
</body>
</html>
