<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iitabi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>iitabi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
@font-face{font-family:'Bareonbatang';src:url('../fonts/HakgyoansimBareonbatangR.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Bareonbatang';src:url('../fonts/HakgyoansimBareonbatangB.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:linear-gradient(165deg,#f7f4ee 0%,#f3f1ec 55%,#f6f3ee 100%);
  --tx:#5c5650;--sub:#6c655d;
  --line:rgba(195,175,168,.3);--track:rgba(195,175,168,.25);
  --card:rgba(255,253,248,.5);--cardb:rgba(200,175,140,.55);
  --shadow:0 1.5px 1.5px rgba(255,255,255,.9) inset,0 -8px 14px -10px rgba(120,110,95,.15) inset,0 5px 14px rgba(150,140,120,.08);
  --chip:rgba(255,253,248,.7);--inp:rgba(255,255,255,.5);--inpb:rgba(220,205,180,.4);
  /* 선택 강조 = pal-lavender, 실행/강조 칩 = pal-yellow (iikoto --pal-* 토큰) */
  --sel-bg:rgba(210,175,225,.55);--sel-bd:rgba(160,105,180,.55);--sel-tx:rgb(120,69,139);--sel-solid:rgba(160,105,180,.75);
  --yel-bg:rgba(255,225,120,.6);--yel-bd:rgba(235,180,20,.55);--yel-tx:rgb(135,99,0);
  --sans:'DM Sans','Apple SD Gothic Neo','Noto Sans KR',sans-serif;--serif:'Bareonbatang','Noto Serif KR',serif;
  /* 세부 구분선(점선): 1px 점 · 4px 간격 · 연하게 */
  --dots:linear-gradient(to right,rgba(150,135,125,.24) 0 1px,transparent 1px 4px);--dots-sz:4px 1px;
  --c-morning:rgb(135,99,0);--c-afternoon:rgb(142,51,51);--c-night:rgb(120,69,139)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;min-height:calc(100% + env(safe-area-inset-top));background:var(--bg);background-color:#f6f3ee}
html,body{word-break:keep-all;overflow-wrap:break-word;margin:0;color:var(--tx);font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;touch-action:manipulation}
body{height:100%;overflow:hidden;background:var(--bg);background-color:#f6f3ee}
#bg-fixed{position:fixed;inset:0;z-index:0;background:radial-gradient(90% 34% at 100% 0%,var(--glow,transparent),transparent 72%),var(--bg);background-color:#f6f3ee}
button,a,input,select,textarea,label{touch-action:manipulation}
.ti{line-height:1;display:inline-block;vertical-align:middle}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
a{color:var(--sel-tx)}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100vh;height:-webkit-fill-available;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#topsafe{height:env(safe-area-inset-top);flex:none}
#pin{flex:none;padding:12px 20px 0;display:flex;flex-direction:column;gap:8px}
#pin:empty{display:none}
#pin>*{flex:none}
#screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 20px 24px;display:flex;flex-direction:column;gap:14px}
#screen>*{flex:none}
#tabbar{flex:none;display:flex;background:transparent;border-top:1px solid rgba(200,175,140,.45);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
#tabbar button{flex:1;min-height:50px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--sub);padding:0}
#tabbar button.on{color:var(--tc,var(--sel-tx));font-weight:700}
#tabbar .tabi{height:28px;display:flex;align-items:center;justify-content:center}
#tabbar button.on .tabi .ti{color:var(--ts)}
h1 .hl{background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 3px;margin:0 -3px;border-radius:2px}
.bdg{display:inline-flex;align-items:center;justify-content:center;border-radius:30%;flex:none}
h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.2}
.sub{font-size:13px;color:var(--sub);margin-top:4px}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:34px;margin-top:-4px}
.titlebar .syncst{min-height:0;padding-bottom:3px}
.titlebar .prebtn{margin:-3px -6px -3px 0}  /* 터치 영역(40px)은 유지하고 줄 높이에는 덜 반영 */
.fab{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--yel-bd);background:var(--yel-bg);color:var(--yel-tx);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 10px rgba(235,180,20,.25)}
.card{background:var(--card);border:1.4px solid var(--cardb);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.sm{padding:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.2;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--sel-bg);border-color:var(--sel-bd);color:var(--sel-tx)}
.chip.pn{background:var(--yel-bg);border-color:var(--yel-bd);color:var(--yel-tx)}
.chip.ln{background:var(--chip);border-color:var(--cardb);color:var(--sub)}
.muted{color:var(--sub)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.btn{min-height:44px;border-radius:14px;border:1px solid var(--cardb);background:var(--chip);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--tx)}
.btn.pri{background:var(--yel-bg);color:var(--yel-tx);border:1px solid var(--yel-bd);font-weight:700;font-size:15px;min-height:48px;width:100%}
.btn.sm{min-height:44px;border-radius:999px;padding:0 11px;gap:4px}
.btn.on{background:var(--sb,var(--sel-bg));color:var(--st,var(--sel-tx));border-color:var(--sbd,var(--sel-bd));font-weight:700}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--cardb);background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--sel-tx);padding:0;text-decoration:none}
.seg{display:flex;gap:6px;padding:4px;background:rgba(255,253,248,.55);border:1px solid var(--cardb);border-radius:14px}
.seg button{flex:1;min-height:44px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--sub);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--sb,var(--sel-bg));border-color:var(--sbd,var(--sel-bd));color:var(--st,var(--sel-tx));font-weight:700}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--sel-solid)}
.plan{flex:1;min-width:0;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--cardb);background:var(--card);min-height:96px;display:flex;flex-direction:column;gap:6px}
.plan.on{background:var(--sel-bg);border:1.4px solid var(--sel-bd)}
.plan.on>span:last-child{color:var(--sel-tx)}
.plan b{font-size:14px}
.plan span{font-size:12px;color:var(--sub);line-height:1.45}
.pl{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,253,248,.6);border:1px solid var(--cardb);font-size:13px}
.pl ul{margin:6px 0 0;padding-left:0;list-style:none}
.pl li{display:flex;align-items:center;gap:8px;padding:4px 0;line-height:1.45}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.ck input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--sel-tx);flex:none}
.ck.done .tx{text-decoration:line-through;color:var(--sub)}
.ck .tx{flex:1;line-height:1.4}
.ck .mini:last-child{margin-right:-4px}
.ck .mini{width:24px;height:44px;border:0;background:transparent;color:var(--sub);padding:0;display:flex;align-items:center;justify-content:center}
.ck input.edit{flex:1;min-width:0;height:40px;border:1px solid var(--sel-bd);border-radius:8px;padding:0 8px;background:rgba(255,255,255,.7);font-size:16px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addbtn{width:44px;padding:0;flex:none;color:var(--sel-tx)}
.addwrap{position:relative}
.fpop{position:absolute;right:0;bottom:calc(100% - 2px);z-index:4;display:flex;gap:6px;padding:8px;background:#fffdf8;border:1px solid var(--cardb);border-radius:16px;box-shadow:0 10px 28px rgba(120,110,95,.26)}
.fpop[hidden]{display:none}
.fpop:after{content:'';position:absolute;right:16px;bottom:-6px;width:10px;height:10px;background:#fffdf8;border-right:1px solid var(--cardb);border-bottom:1px solid var(--cardb);transform:rotate(45deg)}
.fpop .tschip{min-height:40px;padding:0 13px}
.addrow input,.fld{flex:1;min-width:0;height:44px;border:1px solid var(--inpb);border-radius:12px;background:var(--inp);padding:0 14px;font-size:16px}
textarea.fld{height:auto;min-height:72px;padding:10px 12px;width:100%}
select.fld{background:rgba(255,255,255,.7)}
.sheetwrap{position:fixed;inset:0;background:rgba(92,86,80,.3);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(160deg,#f8f5ee,#fbf8f1);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:90%;display:flex;align-items:center;gap:12px}
.gantt{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.syncst{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:transparent;border:0;padding:0;min-height:44px}

.dtitle{display:flex;align-items:center;gap:0}
.sunl{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.sunl i:nth-of-type(2){margin-left:8px}
.dnum{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;padding:0 4px}
.dnum .dwd{font-size:16px;font-weight:400;color:var(--sub)}
.dnav{width:32px;height:44px;border:0;background:transparent;color:var(--sub);opacity:.5;padding:0;display:flex;align-items:center;justify-content:center}
.dnav.off{opacity:.18;pointer-events:none}
.mrow{display:flex;gap:10px;padding:8px 0}
.mrow .mt{width:44px;flex:none;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:3px}
.mrow .mb{flex:1;min-width:0;font-size:14px;line-height:1.55}
.mrow .mb.mpw{display:flex;gap:10px;align-items:flex-start}
.mtx{flex:1;min-width:0}
/* 체크리스트 알림 줄(등록 시트·수정) */
.alrow{height:46px;border:1px solid rgba(220,205,180,.8);border-radius:10px;background:rgba(255,255,255,.6);display:flex;align-items:center;gap:4px;padding:0 6px 0 4px}
.alrow button{border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.alrow .albtn{width:38px;height:38px;color:#a89a8c}
.alrow .altx{flex:1;height:38px;justify-content:flex-start;font-size:14px;color:#a89a8c}
.alrow .alx{width:38px;height:38px;color:#a89a8c}
.alrow.has .altx{color:var(--tx)}
.alrow.on .albtn{color:rgb(120,69,139)}
.belt{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:rgb(120,69,139);font-variant-numeric:tabular-nums;flex:none}
.tsc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tsc.hscroll{flex-wrap:nowrap;overflow-x:auto;padding:2px;margin-left:-2px;margin-right:-2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tsc.hscroll::-webkit-scrollbar{display:none}
.tsc.hscroll .chip{flex:none;white-space:nowrap}
.chip.tsb{background:var(--chip);border:1px solid var(--cardb);color:var(--sub);min-height:36px;padding:0 14px;font-size:13px;cursor:pointer}
.chip.tsb.on{background:var(--sb,var(--sel-bg));border-color:var(--sbd,var(--sel-bd));color:var(--st,var(--sel-tx));font-weight:700}
.tshead{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.04em;padding:10px 0 0}
.ck .ct{border:0;background:transparent;font-size:12px;color:var(--sub);min-height:44px;padding:0 4px;font-variant-numeric:tabular-nums}
.ckedit{border-bottom:1px solid var(--line);padding-bottom:10px}

.day-btn{position:relative;flex:1 0 38px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;border:1px solid rgba(255,210,200,.28);background:rgba(255,250,240,.5);color:var(--tx);transition:all .15s;min-height:44px}
.day-btn.sel{background:rgba(255,253,248,.9);border:1px solid rgba(230,185,110,.55);box-shadow:0 4px 14px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,253,248,.7)}
.day-name{font-size:12px;color:var(--sub)}
.tl{position:relative;display:flex;flex-direction:column;gap:4px}
.tl:before{content:'';position:absolute;left:63px;top:14px;bottom:14px;width:2px;background:var(--line)}
.ev{display:flex;align-items:flex-start;gap:8px;position:relative}
.ev .evdot{width:24px;flex:none;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ev .dotv{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--cc);background:#fffefa;transition:background .15s}
.ev .evdot[aria-pressed=true] .dotv{background:linear-gradient(var(--cc),var(--cc)),#fffefa}
.ev .memodot{pointer-events:none}
.ev .mdot{display:block;width:7px;height:7px;border-radius:50%;background:var(--sub);opacity:.55}
.ev .c{flex:1;min-width:0}
.ev.mev{--mc:19px}
.ev.mev .evt{height:calc(var(--mc)*2);padding-top:calc(var(--mc) - 7px)}
.ev.mev .evdot{height:calc(var(--mc)*2);margin-top:0}
.card.evdone h3{color:var(--sub)}
.icos{display:flex;flex:none;margin:-4px -8px 0 0}
.icos .ico{width:26px}
.ico{width:34px;height:44px;border:0;background:transparent;color:var(--sel-tx);opacity:.85;padding:0;display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
.memoc{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:12px;border:1px dashed var(--cardb);background:rgba(255,253,248,.35);font-size:13px;line-height:1.5;color:var(--tx)}
.memoc .ti{margin-top:3px;color:var(--sub)}
.memoc>span:not(.mph){flex:1;min-width:0}

.amtbox{display:flex;align-items:center;gap:8px;border:1.4px solid var(--cardb);border-radius:16px;background:var(--card);padding:6px 16px;box-shadow:var(--shadow)}
.amtbox .yen{font-family:var(--serif);font-size:26px;color:var(--sub)}
.amtbox input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--serif);font-size:34px;font-weight:700;height:56px;text-align:right;outline:none;color:var(--tx)}
.xrow{display:flex;align-items:center;gap:8px;padding:7px 0}
.amt{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;white-space:nowrap}
.amt b{font-size:14px;font-weight:700}
.yen{font-size:11px;font-weight:400;color:var(--sub);font-variant-numeric:tabular-nums}
.xrow .xi{width:34px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0}

/* 카드 제목 통일 */
.ctitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ctitle b{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.ctitle .cinfo{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);font-weight:400}
/* 날짜·시간 입력 겹침 방지 */
.dt2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dt2>div{min-width:0}
.dfld{font:inherit;text-align:left;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0;height:44px;border:1px solid var(--inpb);border-radius:12px;background:var(--inp);padding:0 12px 0 14px;font-size:16px;color:var(--tx);overflow:hidden}
.dfld .dv{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dfld .dv.ph{color:var(--sub);opacity:.7}
/* 체크리스트 칩: 네모 · 존재감 낮게 / 시간대 색(본앱: 오전 yellow · 오후 rose · 저녁 lavender) */
.tschip{border-radius:7px;min-height:34px;padding:0 11px;font-size:13px;font-weight:400;background:transparent;border:1px solid var(--line);color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap}
.tschip.on{background:rgba(195,175,168,.14);border-color:var(--cardb);color:var(--tx);font-weight:500}
.tschip.on.ts-morning{background:rgba(255,225,120,.6);border-color:rgba(235,180,20,.55);color:var(--c-morning)}
.tschip.on.ts-afternoon{background:rgba(230,126,126,.45);border-color:rgba(205,95,95,.55);color:var(--c-afternoon)}
.tschip.on.ts-night{background:rgba(210,175,225,.55);border-color:rgba(160,105,180,.55);color:var(--c-night)}
.tschip.on.ts-none{background:rgba(195,175,168,.28)}
.tshead.ts-morning{color:var(--c-morning)}
.tshead.ts-afternoon{color:var(--c-afternoon)}
.tshead.ts-night{color:var(--c-night)}
.ck.ro .ct{display:flex;align-items:center;min-height:44px;padding:0 4px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.ck.ro input[type=checkbox]:disabled{opacity:1}
.ck.ro input[type=checkbox]:not(:disabled){cursor:pointer}
/* 일정 탭: 월~일 주 단위 + 가로바 */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wk .day-btn{flex:none;min-height:62px;padding:7px 0 5px;gap:0;align-items:center}
.dbadge{position:absolute;top:-6px;right:-4px;box-shadow:0 0 0 2px #f6f3ee;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:rgba(160,105,180,.88);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.dbar{display:block;width:22px;height:3px;border-radius:2px;margin-bottom:5px}
.dnumc{font-size:15px;font-weight:500;color:var(--tx);line-height:1.2}
.dnumc.today-num{color:rgba(180,90,90,.9)}
.day-btn.off{opacity:.35}
.day-btn:disabled{cursor:default}
/* 타임라인 시간 라벨: 체크 전후 위치 고정 */
